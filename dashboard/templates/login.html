<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GhostStack Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}" />
</head>
<body style="align-items: center; justify-content: center;">
    <div class="panel" style="max-width: 360px; margin: auto; margin-top: 20vh;">
        <div class="panel-title">Tactical Command Login</div>
        {% if success %}
        <p class="status-ok">Authenticated. <a href="/" style="color:#3b82f6;">Open dashboard</a></p>
        {% else %}
        {% if error %}<p class="status-err">{{ error }}</p>{% endif %}
        <form method="post">
            <p><label>Username<br><input name="username" style="width:100%;padding:8px;" /></label></p>
            <p><label>Password<br><input name="password" type="password" style="width:100%;padding:8px;" /></label></p>
            <button type="submit" style="width:100%;padding:10px;background:#3b82f6;border:none;color:#fff;">Login</button>
        </form>
        {% endif %}
    </div>
</body>
</html>
