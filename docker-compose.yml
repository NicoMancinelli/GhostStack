version: '3.8'

services:
  ghoststack-core:
    build: .
    container_name: ghoststack-core
    privileged: true # Required for direct SDR/USB hardware access
    network_mode: "host" # Required for raw packet sniffing
    environment:
      PYTHONPATH: /app
      GHOSTSTACK_DB: /app/data/ghoststack.db
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./data:/app/data
    # Starts the RF scanner by default for demonstration
    command: python3 scripts/ghoststack_ctl.py start-rf
    
  ghoststack-dashboard:
    build: .
    container_name: ghoststack-dashboard
    ports:
      - "5000:5000"
    environment:
      PYTHONPATH: /app
      GHOSTSTACK_DB: /app/data/ghoststack.db
      GHOSTSTACK_DASHBOARD_USER: ${GHOSTSTACK_DASHBOARD_USER:-ghost}
      GHOSTSTACK_DASHBOARD_PASSWORD: ${GHOSTSTACK_DASHBOARD_PASSWORD:-stack}
    volumes:
      - ./data:/app/data
    command: python3 dashboard/app.py
    depends_on:
      - ghoststack-core

  gamutrf:
    image: iqtlabs/gamutrf:latest
    container_name: gamutrf
    privileged: true
    network_mode: "host"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    # Command runs GamutRF MQTT output targeting the local broker
    command: gamutrf-scan --freq-start 2400e6 --freq-end 2483e6 --sample-rate 20e6 --gain 40 --classifier --mqtt_server 127.0.0.1
